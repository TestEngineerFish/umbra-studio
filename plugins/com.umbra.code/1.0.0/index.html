<!DOCTYPE html>
<meta charset="utf-8"><title>代码</title>
<link rel="stylesheet" href="./theme.css">
<body>
  <div id="err" class="err" hidden></div>
  <!-- 未落盘横条**留在正文里**，不进编辑栏（和 md 插件同一条：
       它是状态提示，编辑栏那一行装的是开关，混在一起横条一出现编辑栏就跳）。 -->
  <div id="dirty" class="bar" hidden>
    <span id="note"></span><span class="sp"></span>
    <button id="discard" class="btn ghost">放弃</button>
    <button id="save" class="btn primary">落盘 ⌘S</button>
  </div>
  <!-- 只读：一枚标签 + 解锁（S18 §一.4）。**不出横条** —— 只读本身不是警告 -->
  <div id="ro" class="bar ro" hidden>
    <span id="roLabel" class="tag">🔒 <span id="roText">只读</span></span>
    <span class="sp"></span>
    <button id="unlock" class="btn">解锁编辑</button>
  </div>
  <!-- 草稿暂存（M10-2c，S18 演示态 11/12）：打开时先给盘上的，顶上一条齐边横条。
       ⚠️ 两态的「丢掉」合成一颗放在外面 —— 稿里 fresh / stale 各画了一颗，
       但功能一模一样，而重复的 id 是错的。视觉上没有差别。 -->
  <div id="draft" class="bar draft" hidden>
    <span class="dot"></span>
    <span id="draftText"></span>
    <span id="draftDelta" class="mono"></span>
    <span class="sp"></span>
    <button id="draftDiscard" class="btn ghost">丢掉</button>
    <button id="draftOverwrite" class="btn" title="盘上那一版会先存成一版，覆盖错了还能退回来" hidden>用草稿覆盖</button>
    <button id="draftDiff" class="btn primary" hidden>看差异</button>
    <button id="draftRestore" class="btn primary" hidden>恢复</button>
    <button id="draftBack" class="btn primary" hidden>回到盘上那份</button>
  </div>
  <div id="host"></div>
  <!-- 只读下按了字键：光标下方出一行原因 + 解锁。**只出第一次** -->
  <div id="roHint" class="hint" hidden>
    <span id="roWhy"></span>
    <button id="unlock2" class="btn primary sm">解锁编辑</button>
  </div>
  <!-- ⚠️ 顺序要紧：`umbra.js` 是**经典脚本**（立即执行），`app.mjs` 是**模块**（自带 defer）。
       和 md 插件同一条 —— 经典脚本这一行必须在前面才保证 `umbra` 已就位。 -->
  <script src="./umbra.js"></script>
  <script type="module" src="./app.mjs"></script>
</body>
